<div
    class="relative flex flex-col bg-white shadow-md border border-gray-200 rounded-lg w-56 h-72 transition-all duration-300 ease-in-out hover:hover:scale-110">
    <div class="relative h-40 overflow-hidden rounded-t-lg">
        <img [src]="pizza.pizzaImg.url" class="w-full h-full object-cover" alt="{{pizza.pizzaName}}" />
    </div>

    <div class="flex flex-col flex-grow p-3">
        <h6 class="text-lg font-semibold text-slate-800 truncate">
            {{pizza.pizzaName}}
        </h6>
        <p class="text-sm text-slate-600 leading-tight mt-1 line-clamp-3">
            {{pizza.description}}
        </p>
    </div>

    <div class="flex items-center justify-between px-3 pb-3">
        <span class="text-red-800 text-base font-bold">R${{pizza.price.toFixed(2).replace('.',',')}}</span>
        <button (click)="addToCart()"
            class="rounded bg-green-800 py-1 px-3 text-white text-sm font-medium transition hover:bg-green-700 active:bg-green-600">
            Adicionar
        </button>
    </div>
</div>
